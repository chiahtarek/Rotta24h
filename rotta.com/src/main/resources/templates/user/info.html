<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <title>My Profile - Rotta 24h</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/rotta.css}">
</head>

<body>

    <!-- NAVBAR -->

    <div th:replace="~{/fragments/navbar :: navbar}"></div>


    <div class="container">

        <!-- PAGE HEADER -->

        <div class="page-title">

            <h2>
                My Profile 👤
            </h2>

            <p class="text-muted mb-0">
                Manage your account information.
            </p>

        </div>


        <!-- SUCCESS MESSAGE -->

        <div
            class="alert alert-success"
            th:if="${successMessage}"
            th:text="${successMessage}">
        </div>


        <!-- ERROR MESSAGE -->

        <div
            class="alert alert-danger"
            th:if="${errorMessage}"
            th:text="${errorMessage}">
        </div>


        <div class="row">


            <!-- USER PROFILE -->

            <div class="col-md-7 mb-4">

                <div class="profile-card">

                    <!-- AVATAR -->

                    <div class="text-center">

                        <div class="profile-avatar">

                            <!-- Show U when fullName is empty/null -->

                            <span th:if="${#strings.isEmpty(user.fullName)}">
                                U
                            </span>

                            <!-- Show first letter when fullName exists -->

                            <span
                                th:unless="${#strings.isEmpty(user.fullName)}"
                                th:text="${#strings.substring(user.fullName, 0, 1).toUpperCase()}">
                                U
                            </span>

                        </div>


                        <!-- NAME -->

                        <div
                            class="profile-name"
                            th:text="${#strings.isEmpty(user.fullName) ? 'User' : user.fullName}">

                            John Doe

                        </div>


                        <!-- EMAIL -->

                        <div
                            class="profile-email"
                            th:text="${user.login}">

                            john@email.com

                        </div>

                    </div>


                    <!-- USER INFORMATION -->

                    <div class="profile-info">

                        <div class="row">

                            <!-- NAME -->

                            <div class="col-md-6 mb-4">

                                <div class="info-label">
                                    Name
                                </div>

                                <div
                                    class="info-value"
                                    th:text="${#strings.isEmpty(user.fullName) ? 'Not provided' : user.fullName}">

                                    John Doe

                                </div>

                            </div>


                            <!-- EMAIL -->

                            <div class="col-md-6 mb-4">

                                <div class="info-label">
                                    Email
                                </div>

                                <div
                                    class="info-value"
                                    th:text="${user.login}">

                                    john@email.com

                                </div>

                            </div>

                        </div>


                        <!-- ACTIONS -->

                        <div class="mt-2 page-actions">

                            <!-- CHANGE PASSWORD -->

                            <a
                                th:href="@{/profile/change-password}"
                                class="btn btn-moto mr-2">

                                🔐 Change Password

                            </a>


                            <!-- LOGOUT -->

                            <form
                                th:action="@{/logout}"
                                method="post"
                                style="display: inline;">

                                <button
                                    type="submit"
                                    class="btn btn-danger-custom">

                                    🚪 Logout

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>


            <!-- OPEN CALLS -->

            <div class="col-md-5 mb-4">

                <div class="calls-card text-center">

                    <div class="calls-icon">
                        📋
                    </div>


                    <!-- OPEN CALLS NUMBER -->

                    <div
                        class="calls-number"
                        th:text="${openCallsCount}">
                        3
                    </div>


                    <div class="calls-title">
                        Open Calls
                    </div>


                    <div class="calls-description">

                        You currently have
                        <strong th:text="${openCallsCount}">
                            3
                        </strong>
                        open service calls.

                    </div>


                    <!-- VIEW CALLS -->

                    <div class="mt-4">

                        <a
                            th:href="@{/calls}"
                            class="btn btn-outline-primary">

                            📋 View My Calls

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js">
    </script>

</body>

</html>
