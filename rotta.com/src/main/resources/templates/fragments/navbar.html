<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="location-tracker-styles">
        <link rel="stylesheet" th:href="@{/css/rotta.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="navbar">
    <nav class="navbar app-navbar" aria-label="Navegação principal"
         th:with="navUser=${navigationUser != null ? navigationUser : user}">
        <a class="navbar-brand" th:href="@{/dashboard/test}">🏍 Rotta 24h</a>
        <button class="app-nav-toggle" type="button" aria-controls="navbarMenu"
                aria-expanded="false" aria-label="Abrir menu de navegação">
            <span aria-hidden="true">☰</span> Menu
        </button>
        <div class="app-nav-menu" id="navbarMenu">
            <ul class="app-nav-links">
                <li><a th:href="@{/dashboard/test}">Dashboard</a></li>
                <li th:if="${navUser != null and navUser.role != null and navUser.role.name() == 'RIDER'}">
                    <a th:href="@{/motorcycle/add}">Cadastrar moto</a>
                </li>
                <li th:if="${navUser != null and navUser.role != null and navUser.role.name() == 'RIDER'}">
                    <a th:href="@{/motorcycle/list}">Minhas motos</a>
                </li>
                <li><a th:href="@{/help/request}">Pedir ajuda</a></li>
            </ul>
            <details class="app-account-menu">
                <summary>👤 <span th:text="${navUser != null and !#strings.isEmpty(navUser.fullName) ? navUser.fullName : 'Minha conta'}">Minha conta</span></summary>
                <div class="app-account-links">
                    <a th:href="@{/user/profile}">Meu perfil</a>
                    <a class="text-danger" th:href="@{/auth/logout}">Sair</a>
                </div>
            </details>
        </div>
    </nav>
    <th:block th:replace="~{fragments/active-help-requests :: notice}"></th:block>
    <script defer th:src="@{/js/navbar.js}"></script>
</th:block>
</body>
</html>
