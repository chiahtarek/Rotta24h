<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:fragment="location-tracker-styles">
        <link rel="stylesheet" th:href="@{/css/rotta.css}">
    </th:block>
</head>

<body>

    <th:block th:fragment="navbar">
    <nav class="navbar navbar-expand-lg">

        <a class="navbar-brand"
           th:href="@{/dashboard}"
           style="color:#fff;font-weight:bold;font-size:22px;">
            🏍 Rotta 24 - Your App for Help Request
        </a>

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav navbar-buttons ml-3">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/dashboard/test}">
                        🏠 Dashboard
                    </a>
                </li>

                <li class="nav-item"
                    th:if="${user != null and user.role != null and user.role.name() == 'RIDER'}">
                    <a class="nav-link register-motorcycle"
                       th:href="@{/motorcycle/add}">
                        🏍 Register Motorcycle
                    </a>
                </li>

                <li class="nav-item"
                    th:if="${user != null and user.role != null and user.role.name() == 'RIDER'}">
                    <a class="nav-link"
                       th:href="@{/motorcycle/list}">
                        🏍 My Motorcycles
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/help/request}">
                        🆘 Help Request
                    </a>
                </li>

            </ul>

            <ul class="navbar-nav ml-auto">

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="#"
                       data-toggle="dropdown"
                       style="color:white;">
                        👤 <span th:text="${username}">Usuário</span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-right">

                        <a class="dropdown-item"
                           th:href="@{/user/profile}">
                            Meu Perfil
                        </a>

                        <a class="dropdown-item"
                           th:href="@{/configuracoes}">
                            Configurações
                        </a>

                        <div class="dropdown-divider"></div>

                        <a class="dropdown-item text-danger"
                           th:href="@{/auth/logout}">
                            🚪 Sair
                        </a>

                    </div>

                </li>

            </ul>

        </div>

    </nav>

    <th:block th:replace="~{fragments/active-help-requests :: notice}"></th:block>
    </th:block>

</body>

</html>
