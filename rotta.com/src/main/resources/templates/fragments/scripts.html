<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <th:block th:fragment="location-tracker-styles">
        <style>
          .notificacao {
        position: fixed;

        top: 24px;
        right: 24px;

        width: 430px;
        max-width: calc(100vw - 40px);

        background: #ffffff;

        border-radius: 18px;

        padding: 22px;

        box-sizing: border-box;

        z-index: 999999;

        box-shadow:
            0 12px 35px rgba(0, 0, 0, 0.25),
            0 4px 10px rgba(0, 0, 0, 0.10);

        border-left: 7px solid #d32f2f;

        animation: notificacaoEntrar 0.35s ease-out;

        font-family: Arial, sans-serif;
    }


    /* =========================================================
       TÍTULO
       ========================================================= */

    .notificacao strong {
        display: block;

        margin-bottom: 10px;

        color: #d32f2f;

        font-size: 21px;

        font-weight: 700;

        line-height: 1.3;
    }


    /* =========================================================
       MENSAGEM
       ========================================================= */

    .notificacao p {
        margin: 0 0 16px;

        font-size: 16px;

        line-height: 1.5;

        color: #333;
    }


    /* =========================================================
       BOTÕES
       ========================================================= */

    .notificacao button {
        padding: 11px 20px;

        margin-right: 8px;

        border: none;

        border-radius: 8px;

        cursor: pointer;

        font-size: 15px;

        font-weight: 600;

        transition:
            background 0.2s ease,
            transform 0.1s ease;
    }


    .notificacao button:active {
        transform: scale(0.97);
    }


    /* =========================================================
       ACEITAR
       ========================================================= */

    .notificacao .aceitar {
        background: #2e7d32;

        color: white;
    }


    .notificacao .aceitar:hover {
        background: #1b5e20;
    }


    /* =========================================================
       RECUSAR
       ========================================================= */

    .notificacao .recusar {
        background: #757575;

        color: white;
    }


    .notificacao .recusar:hover {
        background: #616161;
    }


    /* =========================================================
       NOTIFICAÇÃO ACCEPTED
       ========================================================= */

    .notificacao.accepted {
        border-left-color: #2e7d32;

        z-index: 1000000;
    }


    .notificacao.accepted strong {
        color: #2e7d32;
    }


    /* =========================================================
       BOTÃO FECHAR
       ========================================================= */

    .notificacao .fechar {
        background: #1976d2;

        color: white;
    }


    .notificacao .fechar:hover {
        background: #1565c0;
    }


    /* =========================================================
       NOTIFY HELPER
       ========================================================= */

    .notificacao.notifyhelper {
        width: 470px;

        max-width: calc(100vw - 40px);

        border-left-color: #1976d2;

        background: #ffffff;

        z-index: 1000001;

        padding: 26px;
    }


    .notificacao.notifyhelper strong {
        color: #1976d2;

        font-size: 23px;
    }


    .notificacao.notifyhelper p {
        font-size: 17px;

        line-height: 1.5;
    }


    /* =========================================================
       CONTADOR
       ========================================================= */

    .notificacao .contador {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        min-width: 38px;

        height: 38px;

        padding: 0 10px;

        margin-top: 8px;

        border-radius: 20px;

        background: #1976d2;

        color: white;

        font-size: 17px;

        font-weight: bold;
    }


    /* =========================================================
       ANIMAÇÃO DE ENTRADA
       ========================================================= */

    @keyframes notificacaoEntrar {

        from {
            opacity: 0;

            transform:
                translateX(80px)
                scale(0.95);
        }

        to {
            opacity: 1;

            transform:
                translateX(0)
                scale(1);
        }
    }


    /* =========================================================
       RESPONSIVO - CELULAR
       ========================================================= */

    @media (max-width: 600px) {

        .notificacao {

            top: 12px;
            left: 12px;
            right: 12px;

            width: auto;

            max-width: none;

            padding: 20px;

            border-radius: 16px;
        }


        .notificacao strong {

            font-size: 19px;
        }


        .notificacao p {

            font-size: 15px;
        }


        .notificacao.notifyhelper {

            width: auto;

            max-width: none;

            padding: 22px;
        }


        .notificacao.notifyhelper strong {

            font-size: 21px;
        }


        .notificacao button {

            padding: 12px 18px;

            font-size: 15px;
        }
    }
        </style>
    </th:block>

    <th:block th:fragment="location-tracker-script">
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
        <script th:src="@{/js/location-tracker.js}"></script>
    </th:block>

</body>

</html>
