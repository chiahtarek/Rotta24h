<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register Motorcycle test</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <h2>Register Motorcycle</h2>

    <!-- Success message -->
    <div class="alert alert-success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <!-- Error message -->
    <div class="alert alert-danger"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/motorcycle/add}" method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <!-- Brand -->
        <div class="form-group">
            <label for="brand">Brand</label>
            <input
                type="text"
                id="brand"
                name="brand"
                class="form-control"
                placeholder="Brand"
                required>
        </div>

        <!-- Model -->
        <div class="form-group">
            <label for="model">Model</label>
            <input
                type="text"
                id="model"
                name="model"
                class="form-control"
                placeholder="Model"
                required>
        </div>

        <!-- License Plate -->
        <div class="form-group">
            <label for="licensePlate">License Plate</label>
            <input
                type="text"
                id="licensePlate"
                name="licensePlate"
                class="form-control"
                placeholder="License Plate"
                required>
        </div>

        <!-- Year -->
        <div class="form-group">
            <label for="year">Year</label>
            <input
                type="number"
                id="year"
                name="year"
                class="form-control"
                min="1900"
                max="2100"
                placeholder="Year"
                required>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Motorcycle
        </button>

        <a th:href="@{/dashboard}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
