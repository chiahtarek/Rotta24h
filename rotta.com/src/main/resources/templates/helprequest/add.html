<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <title>RideAssist - Request Help</title>

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <th:block th:replace="~{fragments/scripts :: location-tracker-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/rotta.css}">
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{/fragments/navbar :: navbar}"></div>

    <!-- Success message -->
    <div
        class="alert alert-success"
        th:if="${successMessage}"
        th:text="${successMessage}">
    </div>

    <!-- Page content -->
    <div class="page-content">

        <div class="card">

            <h1>Need Help?</h1>

            <p>
                Select the problem and press the button below to send your location.
            </p>

            <select
                id="problemType"
                onchange="showOtherDescription()">

                <option value="FLATTIRE">Flat Tire</option>
                <option value="FUEL">Out of Fuel</option>
                <option value="BATTERY">Battery Problem</option>
                <option value="ENGINE">Engine Problem</option>
                <option value="ACCIDENT">Accident</option>
                <option value="OTHER">Other</option>

            </select>

            <input
                type="text"
                id="description"
                name="description"
                placeholder="Describe the problem">

            <button
                id="btnHelpRequest"
                type="button"
                onclick="requestHelp()">

                🚨 REQUEST HELP

            </button>

            <p id="status"></p>

        </div>

    </div>

    <script>

        function showOtherDescription() {

            const problemType =
                document.getElementById("problemType").value;

            const input =
                document.getElementById("description");

            if (problemType === "OTHER") {
                input.style.display = "block";
            } else {
                input.style.display = "none";
                input.value = "";
            }
        }


        function requestHelp() {

            const status =
                document.getElementById("status");

            const problemType =
                document.getElementById("problemType").value;

            const description =
                document.getElementById("description").value;

            if (problemType === "OTHER" && description.trim() === "") {
                status.innerHTML =
                    "Please describe the problem.";
                return;
            }

            if (!navigator.geolocation) {
                status.innerHTML =
                    "Your browser doesn't support geolocation.";
                return;
            }

            status.innerHTML =
                "Getting your location...";

            navigator.geolocation.getCurrentPosition(

                async (position) => {

                    const data = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        problemType: problemType,
                        description: description
                    };

                    try {

                        const response = await fetch("/help/request", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            status.innerHTML =
                                "✅ Help request sent successfully!";
                        } else {
                            status.innerHTML =
                                "❌ Could not send help request.";
                        }

                    } catch (e) {

                        status.innerHTML =
                            "❌ Connection error.";

                    }
                },

                () => {
                    status.innerHTML =
                        "Location permission denied.";
                }
            );
        }

    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    <th:block th:replace="~{fragments/scripts :: location-tracker-script}"></th:block>

</body>

</html>
