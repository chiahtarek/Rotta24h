
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acompanhamento - Rotta</title>
    <link rel="stylesheet" th:href="@{/css/rotta.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/scripts :: location-tracker-styles}"></th:block>
</head>

<body>

    <div th:replace="~{/fragments/navbar :: navbar}"></div>

<div class="tracking-container"
     th:attr="
        data-request-id=${tracking.helpRequestId},
        data-distance=${tracking.distanceInMeters},
        data-status=${tracking.status},
        data-arrival-url=@{/helprequest/details/{id}/arrived(id=${tracking.helpRequestId})},
        data-helper-id=${tracking.helperId},
        data-rider-user-id=${tracking.riderUserId}">

    <header class="tracking-header">

        <div>
            <h1>Acompanhamento</h1>

            <p>
                Solicitação #
                <span th:text="${tracking.helpRequestId}"></span>
            </p>
        </div>

        <span id="connectionStatus"
              class="connection-status">
            Conectando...
        </span>

    </header>

    <!-- DISTÂNCIA -->

    <section class="distance-card">

        <span>Distância entre os usuários</span>

        <h2 id="distanceValue"
            th:text="${tracking.distanceInMeters != null ?
                (tracking.distanceInMeters >= 1000 ?
                #numbers.formatDecimal(tracking.distanceInMeters / 1000, 1, 2) + ' km' :
                #numbers.formatDecimal(tracking.distanceInMeters, 1, 0) + ' metros') :
                'Aguardando localização'}">

        </h2>

        <p>Distância calculada em linha reta</p>

    </section>

    <section class="users-container">

        <!-- HELPER -->

        <article class="user-card">

            <div class="user-header">

                <div class="user-avatar helper-avatar">
                    H
                </div>

                <div>
                    <h3 id="helperName"
                        th:text="${tracking.helperName}">
                    </h3>

                    <small>Prestador de ajuda</small>
                </div>

            </div>

            <p class="address-label">
                ENDEREÇO ATUAL
            </p>

            <p class="address"
               id="helperAddress"
               th:text="${tracking.helperAddress != null ?
                   tracking.helperAddress :
                   'Localização indisponível'}">
            </p>

            <div class="location-status">
                <span class="location-dot"></span>
                Localização recebida
            </div>

        </article>

        <!-- RIDER -->

        <article class="user-card">

            <div class="user-header">

                <div class="user-avatar rider-avatar">
                    R
                </div>

                <div>
                    <h3 id="riderName"
                        th:text="${tracking.riderName}">
                    </h3>

                    <small>Solicitante</small>
                </div>

            </div>

            <p class="address-label">
                ENDEREÇO ATUAL
            </p>

            <p class="address"
               id="riderAddress"
               th:text="${tracking.riderAddress != null ?
                   tracking.riderAddress :
                   'Localização indisponível'}">
            </p>

            <div class="location-status">
                <span class="location-dot"></span>
                Localização recebida
            </div>

        </article>

    </section>

    <section class="arrival-actions">
        <button th:if="${isHelper}" id="arrivedButton" type="button" class="btn btn-primary" hidden
                th:hidden="${tracking.status.name() != 'ACCEPTED' or tracking.distanceInMeters == null or tracking.distanceInMeters > 50}">
            Arrived
        </button>
        <p id="arrivalStatus" role="status" aria-live="polite"
           th:text="${tracking.status.name() == 'ARRIVED' ? 'Chegada confirmada.' : 'Confirme a chegada quando estiverem a até 50 metros.'}"></p>
    </section>
</div>

<script th:src="@{/js/helprequest-details.js}"></script>

<th:block th:replace="~{fragments/scripts :: location-tracker-script}"></th:block>

</body>
</html>
