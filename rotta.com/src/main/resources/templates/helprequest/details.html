
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acompanhamento - Rotta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/scripts :: location-tracker-styles}"></th:block>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/rotta.css}">
</head>

<body>

    <div th:replace="~{/fragments/navbar :: navbar}"></div>

<div class="tracking-container"
     th:attr="
        data-request-id=${tracking.helpRequestId},
        data-distance=${tracking.distanceInMeters},
        data-status=${tracking.status},
        data-arrival-url=@{/helprequest/details/{id}/arrived(id=${tracking.helpRequestId})},
        data-helper-id=${tracking.helperId},
        data-rider-user-id=${tracking.riderUserId},
        data-is-helper=${isHelper},
        data-helper-latitude=${tracking.helperLatitude},
        data-helper-longitude=${tracking.helperLongitude},
        data-rider-latitude=${tracking.riderLatitude},
        data-rider-longitude=${tracking.riderLongitude}">

    <header class="tracking-header">

        <div>
            <h1>Acompanhamento</h1>

            <p>
                Solicitação #
                <span th:text="${tracking.helpRequestId}"></span>
            </p>
        </div>

        <span id="connectionStatus"
              class="connection-status">
            Conectando...
        </span>

    </header>

    <!-- DISTÂNCIA -->

    <section class="distance-card">

        <span>Distância entre os usuários</span>

        <h2 id="distanceValue"
            th:text="${tracking.distanceInMeters != null ?
                (tracking.distanceInMeters >= 1000 ?
                #numbers.formatDecimal(tracking.distanceInMeters / 1000, 1, 2) + ' km' :
                #numbers.formatDecimal(tracking.distanceInMeters, 1, 0) + ' metros') :
                'Aguardando localização'}">

        </h2>

        <p>Distância calculada em linha reta</p>

    </section>

    <section class="tracking-map-card" aria-label="Mapa de acompanhamento">
        <div class="tracking-map-controls">
            <span class="tracking-map-key tracking-map-self">Você</span>
            <span id="otherMapLabel" class="tracking-map-key tracking-map-other"
                  th:text="${isHelper ? 'Solicitante' : 'Prestador de ajuda'}"></span>
            <button id="fitTrackingMap" type="button" class="btn btn-sm btn-outline-secondary" hidden>
                Recentrar
            </button>
        </div>
        <div id="trackingMap" class="tracking-map" aria-label="Localização dos participantes" hidden></div>
        <p id="trackingMapStatus" role="status">Aguardando localização dos participantes.</p>
    </section>

    <article class="user-card">
        <div class="user-header">
            <div class="user-avatar" th:classappend="${isHelper ? 'rider-avatar' : 'helper-avatar'}"
                 th:text="${isHelper ? 'R' : 'H'}" aria-hidden="true"></div>
            <div>
                <h3 th:text="${tracking.otherName}"></h3>
                <small th:text="${isHelper ? 'Solicitante' : 'Prestador de ajuda'}"></small>
            </div>
        </div>

        <p class="address-label">ENDEREÇO ATUAL</p>
        <p class="address" id="otherAddress"
           th:text="${tracking.otherAddress ?: 'Localização indisponível'}"></p>
    </article>

    <section class="arrival-actions">
        <button th:if="${isHelper}" id="arrivedButton" type="button" class="btn btn-primary" hidden
                th:hidden="${tracking.status.name() != 'ACCEPTED' or tracking.distanceInMeters == null or tracking.distanceInMeters > 50}">
            Confirmar chegada
        </button>
        <p id="arrivalStatus" role="status" aria-live="polite"
           th:text="${tracking.status.name() == 'ARRIVED' ? 'Chegada confirmada.' : (isHelper ? 'Confirme a chegada quando estiverem a até 50 metros.' : 'Aguardando a chegada do prestador de ajuda.')}"></p>
    </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script th:src="@{/js/helprequest-details.js}"></script>

<th:block th:replace="~{fragments/scripts :: location-tracker-script}"></th:block>

</body>
</html>
